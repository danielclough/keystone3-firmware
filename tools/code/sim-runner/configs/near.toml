# Coordinates for keystone3-firmware's real SDL simulator, captured interactively with
# `sim_map` against a TEST_SEED-provisioned instance, NEAR coin selected. Absolute pixel
# coordinates within the simulator's window — Xvfb at exactly 480x800 gives 1:1 coordinates with
# no WM decoration offset.
#
# Screen names are coin-agnostic on purpose (`coin_entry`, `sign_confirm`, not `near_entry`,
# `near_sign_confirm`) — every field in this file except `choose_wallet_filtered.coin_entry`'s
# position (which chain's row shows up where in the filtered list) is common to any coin's
# connect/sign flow, so a new coin's map (see `configs/zcash.toml`) should only need to re-tap the
# handful of coin-specific fields, not remap the whole device.
#
# `reference = "reference/near/<name>.png"` entries are NOT YET CAPTURED — screen-arrival verification
# against a reference crop is not wired up yet; treat every screen below as coordinate-verified,
# not reference-image-verified.

resolution = { w = 480, h = 800 }

# The lock screen shown on every simulator boot once provisioned (device_setting.json's
# `random_pin_pad: 0` keeps this grid fixed across boots).
[screens.pin_pad]
digit_1 = { x = 84, y = 448 }
digit_2 = { x = 240, y = 448 }
digit_3 = { x = 395, y = 448 }
digit_4 = { x = 84, y = 521 }
digit_5 = { x = 240, y = 521 }
digit_6 = { x = 395, y = 521 }
digit_7 = { x = 84, y = 596 }
digit_8 = { x = 240, y = 596 }
digit_9 = { x = 395, y = 596 }
digit_0 = { x = 240, y = 670 }
backspace = { x = 395, y = 670 }
reference = "reference/near/pin_pad.png"

# Swiping to confirm a transaction (screens.sign_confirm) re-prompts for the PIN in a bottom-sheet
# modal before releasing the signature — same digit layout, but shifted up (the modal has a
# "Please Enter Passcode" header + dot row above it, unlike the full-screen lock page).
[screens.reauth_pin_pad]
digit_1 = { x = 84, y = 533 }
digit_2 = { x = 240, y = 533 }
digit_3 = { x = 395, y = 533 }
digit_4 = { x = 84, y = 607 }
digit_5 = { x = 240, y = 607 }
digit_6 = { x = 395, y = 607 }
digit_7 = { x = 84, y = 681 }
digit_8 = { x = 240, y = 681 }
digit_9 = { x = 395, y = 681 }
digit_0 = { x = 240, y = 755 }
backspace = { x = 395, y = 755 }
reference = "reference/near/reauth_pin_pad.png"

[screens.home]
coin_tile = { x = 128, y = 207 }
menu_button = { x = 437, y = 95 }   # top-right "..." — opens Connect Software Wallet / Device Settings
scan_button = { x = 388, y = 710 }
reference = "reference/near/home.png"

# The bottom sheet `home.menu_button` opens.
[screens.home_menu]
connect_software_wallet = { x = 227, y = 650 }
reference = "reference/near/home_menu.png"

# home_menu.connect_software_wallet leads here: a "Choose Wallet" list defaulting to an "All"
# filter tab that does not show any one chain directly (the visible wallets are software-wallet
# *apps* — Keystone Nexus, OKX Wallet, MetaMask, ... — each supporting several chains). Tapping
# the "..." overflow tab reveals per-chain filters.
[screens.choose_wallet]
close_button = { x = 42, y = 95 }
chain_filter_more = { x = 414, y = 173 }   # "..." tab, reveals per-chain filters
reference = "reference/near/choose_wallet.png"

# Appears after chain_filter_more; NEAR's position in that expanded filter list — not guaranteed
# stable if the wallet-app list above it changes, but stable relative to the filter tab row. This
# is the one field a new coin's map genuinely needs to remap: a different coin sits at a different
# row.
[screens.choose_wallet_filtered]
coin_entry = { x = 130, y = 681 }   # NEAR's row
reference = "reference/near/choose_wallet_filtered.png"

# choose_wallet_filtered.coin_entry lands here: the account export QR (for NEAR: Tier-B + all 10
# Tier-A ledger-live keys, crypto-multi-accounts). Cropping qr_region and decoding it yields a
# real, valid, MULTI-PART UR (too large for one frame — animated-QR reassembly is required here).
[screens.connect_wallet]
qr_region = { x = 72, y = 222, w = 336, h = 336 }
reference = "reference/near/connect_wallet.png"

# home.scan_button reads `ui_simulator/assets/qrcode_data.txt` (one UR string per line — write a
# sign-request UR here, one line, before booting or before this tap) and lands here. The approve
# control is a SWIPE slider ("Swipe to confirm"), not a tap button or hold-to-confirm. Swiping
# triggers `screens.reauth_pin_pad` before the signature is released.
[screens.sign_confirm]
swipe_from = { x = 88, y = 743 }
swipe_to = { x = 440, y = 743 }
reference = "reference/near/sign_confirm.png"

# After `reauth_pin_pad` succeeds: the signature output QR + a "Done" button.
[screens.sign_response]
qr_region = { x = 72, y = 180, w = 336, h = 336 }
done_button = { x = 240, y = 743 }
reference = "reference/near/sign_response.png"
